<html lang="de">

    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #020408;
            color: #38bdf8;
            overflow-x: hidden;
        }

        /* Matrix Rain Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.15;
        }

        /* Ambient Glow & Chaos Mesh */
        .glow-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 10% 20%, rgba(236, 72, 153, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* Unübersichtliches Glitch Glass Panel */
        .cyber-panel {
            background: rgba(6, 11, 25, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.15), inset 0 0 15px rgba(236, 72, 153, 0.1);
        }

        /* Custom Dense Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(2, 4, 8, 0.9);
        }
        ::-webkit-scrollbar-thumb {
            background: #ec4899;
            box-shadow: 0 0 10px #ec4899;
        }

        /* Chaotische Pass-Item Interaktivität */
        .pass-item {
            color: #64748b;
            cursor: pointer;
            transition: all 0.1s ease;
            padding: 2px 4px;
            border-radius: 2px;
            display: inline-block;
            word-break: keep-all;
            white-space: nowrap;
            letter-spacing: -0.02em;
            position: relative;
        }
        .pass-item:hover {
            color: #00ffcc;
            background-color: rgba(236, 72, 153, 0.25);
            text-shadow: 0 0 8px #00ffcc, 0 0 15px #ec4899;
            transform: scale(1.05) rotate(0.5deg);
            z-index: 30;
        }
        .pass-item:active {
            transform: scale(0.92);
        }

        /* Copied Glitch State */
        .pass-item.copied {
            color: #f43f5e !important;
            background-color: rgba(244, 63, 94, 0.3) !important;
            text-shadow: 0 0 12px #f43f5e, 0 0 20px #e11d48;
            animation: glitch-pulse 0.4s ease-in-out;
        }

        @keyframes glitch-pulse {
            0% { transform: translate(-2px, 1px); }
            50% { transform: translate(2px, -1px); }
            100% { transform: translate(0, 0); }
        }

        /* Heavy CRT Scanlines & Visual Noise Overlay */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.4) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.6;
        }

        /* Pulsierendes Cyber HUD Element */
        .hud-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, #ec4899, #38bdf8, transparent);
            animation: hud-sweep 3s infinite linear;
        }

        @keyframes hud-sweep {
            0% { opacity: 0.2; transform: scaleX(0.8); }
            50% { opacity: 1; transform: scaleX(1.05); }
            100% { opacity: 0.2; transform: scaleX(0.8); }
        }

            const tempInput = document.createElement('textarea');
            tempInput.value = passwordText;
            document.body.appendChild(tempInput);
            tempInput.select();

            try {
                document.execCommand('copy');
                copiedSet.add(index);
                renderPasswordStream();
                showToast(`COPIED NODE #${index + 1}: ${passwordText}`);
            } catch (err) {
                showToast('INTERCEPT_FAILED');
            }

            document.body.removeChild(tempInput);
        }

        function updateStats() {
            const total = FIXED_PASSWORDS_250.length;
            const copied = copiedSet.size;

            if (statTotalEl) statTotalEl.textContent = total;
            if (statCopiedEl) statCopiedEl.textContent = `${copied} / ${total}`;
        }

        function resetStats() {
            copiedSet.clear();
            renderPasswordStream();
            showToast("BUFFER PURGED");
        }

        let toastTimeout;
        function showToast(message) {
            const toastMsg = document.getElementById('toast-message');
            if (toastMsg && toast) {
                toastMsg.textContent = message;

                toast.classList.remove('-translate-y-24', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('translate-y-0', 'opacity-100');
                    toast.classList.add('-translate-y-24', 'opacity-0');
                }, 1400);
            }
        }

        window.onload = function() {
            renderPasswordStream();
        };
    </script>
</body>
</html>
